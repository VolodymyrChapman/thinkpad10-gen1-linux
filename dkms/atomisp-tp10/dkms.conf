# atomisp (Intel Atom ISP2) + ov2722 + imx175 for Lenovo ThinkPad 10, from Kali linux-source-7.2
# Local changes (pending upstream): ov2722 SGRBG10 fix; new imx175 driver;
# INTCF1A added to ipu-bridge and to atomisp_csi2_bridge (4 lanes).
# atomisp: only enumerate frame sizes the preview pipeline can output;
# report frame intervals for sensors without enum_frame_interval.
# leds-lm3554: new driver for the rear flash LED, with led-class-flash
# (not built by the Kali 7.2 kernel).
# imx175: report success from disable_streams once powered down.
# atomisp: use a DW9714 VCM for the IMX175; dw9714 (not built by Kali 7.2).
PACKAGE_NAME="atomisp-tp10"
PACKAGE_VERSION="1.8"
B="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
MAKE[0]="make -C ${kernel_source_dir} M=$B CONFIG_INTEL_ATOMISP=y CONFIG_VIDEO_ATOMISP=m CONFIG_VIDEO_ATOMISP_OV2722=m modules && make -C ${kernel_source_dir} M=$B/imx175 modules && make -C ${kernel_source_dir} M=$B/ipu-bridge modules && make -C ${kernel_source_dir} M=$B/leds modules && make -C ${kernel_source_dir} M=$B/vcm modules"
CLEAN="make -C ${kernel_source_dir} M=$B clean; make -C ${kernel_source_dir} M=$B/imx175 clean; make -C ${kernel_source_dir} M=$B/ipu-bridge clean; make -C ${kernel_source_dir} M=$B/leds clean; make -C ${kernel_source_dir} M=$B/vcm clean"
BUILT_MODULE_NAME[0]="atomisp"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="atomisp_gmin_platform"
BUILT_MODULE_LOCATION[1]="pci/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="atomisp-ov2722"
BUILT_MODULE_LOCATION[2]="i2c/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
BUILT_MODULE_NAME[3]="imx175"
BUILT_MODULE_LOCATION[3]="imx175/"
DEST_MODULE_LOCATION[3]="/updates/dkms"
BUILT_MODULE_NAME[4]="ipu-bridge"
BUILT_MODULE_LOCATION[4]="ipu-bridge/"
DEST_MODULE_LOCATION[4]="/updates/dkms"
BUILT_MODULE_NAME[5]="led-class-flash"
BUILT_MODULE_LOCATION[5]="leds/"
DEST_MODULE_LOCATION[5]="/updates/dkms"
BUILT_MODULE_NAME[6]="leds-lm3554"
BUILT_MODULE_LOCATION[6]="leds/"
DEST_MODULE_LOCATION[6]="/updates/dkms"
BUILT_MODULE_NAME[7]="dw9714"
BUILT_MODULE_LOCATION[7]="vcm/"
DEST_MODULE_LOCATION[7]="/updates/dkms"
AUTOINSTALL="yes"
# Only for the Kali 7.2 kernel; newer kernels use the in-tree drivers.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
